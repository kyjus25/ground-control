services:
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://groundcontrol:groundcontrol@db:5432/groundcontrol
      GC_DATA_ROOT: /data
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: groundcontrol
      POSTGRES_PASSWORD: groundcontrol
      POSTGRES_DB: groundcontrol
    ports:
      # Host port 5433 avoids clashing with a local Postgres on 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U groundcontrol -d groundcontrol']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
